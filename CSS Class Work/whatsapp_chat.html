<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whatsapp Chat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        * {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        .profile_heading {
            height: 50px;
            width: auto;
            background-color: aqua;
            position: relative;

        }

        .heading {
            font-size: 17px;
            margin-top: 15px;
            position: absolute;
            text-indent: 5px;
        }

        .yes {
            text-align: center;
            text-decoration: underline dotted;
        }
        .Tod{
            text-align: center;
            text-decoration: underline dotted;
        }

        .chat_left {
            text-indent: 25px;
        }

        .time_left {
            text-indent: 5px;
            text-decoration: overline;
        }

        .chat_right {
            text-align: right;
        }

        .time_right {
            text-decoration: overline;
            text-align: right;
        }
        p{
            line-height: 3px;
        }
    </style>
</head>

<body>
    <div class="profile_heading">
        <p class="heading"><i class="fa-solid fa-circle-user fa-xl"></i> HARSH PATEL</p>
    </div>
    <p class="yes">Yesterday</p>
    <hr>
    <p class="chat_left">hii john </p>
    <p class="time_left"><i class="fa-solid fa-clock"></i> 11:00 PM</p>
    <p class="chat_right">hii devid, whatsapp! <i class="fa-solid fa-check-double"></i></p>
    <p class="time_right"><i class="fa-solid fa-clock"></i> 11:00 PM</p>
    <p class="chat_left">Fine, can you send me that notes fo communication skills?</p>
    <p class="time_left"><i class="fa-solid fa-clock"></i> 11:01 PM</p>
    <p class="chat left">I want it Urgent</p>
    <p class="time_left"><i class="fa-solid fa-clock"></i> 11:00 PM</p>
    <p class="chat_right">Ok<i class="fa-solid fa-check-double"></i></p>
    <p class="time_right"><i class="fa-solid fa-clock"></i> 11:00 PM</p>
    <p class="Tod">Today</p>
    <hr>
    <p class="chat_right">I have sent it main...<i class="fa-solid fa-check-double"></i></p>
    <p class="time_right"><i class="fa-solid fa-clock"></i> 09:04 PM</p>
    <p class="chat_right">Please check your inbox<i class="fa-solid fa-check-double"></i></p>
    <p class="time_right"><i class="fa-solid fa-clock"></i> 09:05 PM</p>
</body>

</html>
